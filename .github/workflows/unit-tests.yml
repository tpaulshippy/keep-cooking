name: unit-tests

# API (vitest) + web (vitest) unit tests. Runs on PRs and on main pushes
# touching api/web/contracts, so broken unit tests can never land silently
# (cf. contract-check for schema sync, android-check for the Android build).
on:
  pull_request:
  push:
    branches: [main]
    paths: ['api/**', 'apps/web/**', 'packages/contracts/**', '.github/workflows/unit-tests.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: API unit tests
        run: npm test --workspace keep-cooking-api

      - name: Web unit tests
        run: npm run test --workspace keep-cooking-web -- --run
