name: Deploy API

on:
  push:
    branches: [main]
    paths: ['api/**', 'packages/contracts/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

# Only one deploy at a time; extra runs wait their turn (same as bots).
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Provision D1 + R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd api
          # wrangler.toml ships a database_id placeholder: resolve the real id
          # by name (creating the database on first run) and inject it, so the
          # schema apply + deploy below target a real DB. Mirrors bots worker.
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="smidgen") | .uuid // empty')
          if [ -z "$DB_ID" ]; then
            DB_ID=$(npx wrangler d1 create smidgen --json | jq -r .uuid)
          fi
          sed -i "s/database_id = \".*\"/database_id = \"$DB_ID\"/" wrangler.toml
          # Idempotent: succeeds on first run, no-op (|| true) after that.
          npx wrangler r2 bucket create smidgen-photos || true

      - name: Deploy Worker API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          cd api
          # Schema uses CREATE TABLE IF NOT EXISTS, so this is safe to re-run
          # on every deploy. Seed data (drizzle/seed.sql) is a one-time manual
          # step for demo content, not applied here.
          npx wrangler d1 execute smidgen --remote --file=./drizzle/0001_init.sql
          # No custom domain yet: publishes to the out-of-the-box
          # https://smidgen-api.<account>.workers.dev URL.
          npx wrangler deploy
