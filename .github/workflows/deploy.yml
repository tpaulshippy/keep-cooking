name: Deploy API

on:
  push:
    branches: [main]
    paths: ['api/**', 'packages/contracts/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

# Only one deploy at a time; extra runs wait their turn (same as bots).
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Provision D1 + R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd api
          # wrangler.toml ships a database_id placeholder: resolve the real id
          # by name (creating the database on first run) and inject it, so the
          # schema apply + deploy below target a real DB. Mirrors bots worker.
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="keep-cooking") | .uuid // empty')
          if [ -z "$DB_ID" ]; then
            # (No --json on `d1 create` in wrangler >= 4.16x: create, then re-list.)
            npx wrangler d1 create keep-cooking
            DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="keep-cooking") | .uuid // empty')
          fi
          sed -i "s/database_id = \".*\"/database_id = \"$DB_ID\"/" wrangler.toml
          # Idempotent: succeeds on first run, no-op (|| true) after that.
          npx wrangler r2 bucket create keep-cooking-photos || true

      - name: Deploy Worker API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTERNAL_BETA_TOKEN: ${{ secrets.INTERNAL_BETA_TOKEN }}
        run: |
          npm ci
          cd api
          # Schema uses CREATE TABLE IF NOT EXISTS, so this is safe to re-run
          # on every deploy. Seed data (drizzle/seed.sql) is a one-time manual
          # step for demo content, not applied here.
          npx wrangler d1 execute keep-cooking --remote --file=./drizzle/0001_init.sql
          # Rotate the internal-TestFlight beta gate secret from the repo secret
          # (set once via `gh secret set INTERNAL_BETA_TOKEN`).
          if [ -n "$INTERNAL_BETA_TOKEN" ]; then
            echo "$INTERNAL_BETA_TOKEN" | npx wrangler secret put INTERNAL_BETA_TOKEN
          fi
          # Beta household access: the iOS app syncs as x-user-id `beta-user`
          # (pass 2 replaces this with Apple auth). Prod treats unknown users
          # as viewers (writes 403), so ensure the beta membership exists.
          npx wrangler d1 execute keep-cooking --remote --command "INSERT INTO households (id, name) VALUES ('hh-demo', 'Keep Cooking') ON CONFLICT(id) DO NOTHING"
          npx wrangler d1 execute keep-cooking --remote --command "INSERT INTO memberships (household_id, user_id, role) VALUES ('hh-demo', 'beta-user', 'owner') ON CONFLICT(household_id, user_id) DO UPDATE SET role = 'owner'"
          # No custom domain yet: publishes to the out-of-the-box
          # https://keep-cooking-api.<account>.workers.dev URL.
          npx wrangler deploy
