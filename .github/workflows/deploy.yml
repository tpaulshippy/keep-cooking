name: Deploy API + Web

on:
  push:
    branches: [main]
    paths: ['api/**', 'packages/contracts/**', 'apps/web/**', 'sites/marketing/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

# Only one deploy at a time; extra runs wait their turn (same as bots).
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Provision D1 + R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd api
          # wrangler.toml ships a database_id placeholder: resolve the real id
          # by name (creating the database on first run) and inject it, so the
          # schema apply + deploy below target a real DB. Mirrors bots worker.
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="keep-cooking") | .uuid // empty')
          if [ -z "$DB_ID" ]; then
            # (No --json on `d1 create` in wrangler >= 4.16x: create, then re-list.)
            npx wrangler d1 create keep-cooking
            DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="keep-cooking") | .uuid // empty')
          fi
          sed -i "s/database_id = \".*\"/database_id = \"$DB_ID\"/" wrangler.toml
          # Idempotent: succeeds on first run, no-op (|| true) after that.
          npx wrangler r2 bucket create keep-cooking-photos || true

      - name: Deploy Worker API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          cd api
          # Schema uses CREATE TABLE IF NOT EXISTS, so this is safe to re-run
          # on every deploy. Single source for the migration chain: api/package.json
          # db:apply:remote (add future 0005+ there, not here).
          # Seed data (drizzle/seed.sql) is a one-time manual step for demo
          # content, not applied here — and no membership seed is applied
          # either: first verified writer on an empty household becomes owner
          # via first-claim bootstrap in code.
          npm run db:apply:remote
          # No custom domain yet: publishes to the out-of-the-box
          # https://keep-cooking-api.<account>.workers.dev URL.
          npx wrangler deploy

  deploy-marketing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build + deploy marketing site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # No dependencies: the marketing build is Node stdlib only.
          npm run build --prefix sites/marketing
          cd sites/marketing
          # Direct-upload Pages project (no GitHub integration): Actions is
          # the single deploy path. --branch=main pins this as a production
          # deployment (a bare deploy lands as preview and the apex would
          # 404). Apex (keepcooking.app) is a custom domain on this
          # project; /api/* and /app/* stay on their Workers Routes
          # (issues #28/#27) and are unaffected by this deploy.
          npx wrangler pages deploy dist --project-name=keep-cooking --branch=main --commit-hash=${{ github.sha }}

  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Build + deploy web Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npm run build --workspace keep-cooking-web
          cd apps/web
          # Static dist (vite base '/app/') served by worker.ts under /app/*.
          # No custom domain yet: publishes to the out-of-the-box
          # https://keep-cooking-web.<account>.workers.dev URL. Custom-domain
          # routing (keepcooking.app/app/*) is a dashboard Workers Route,
          # same pattern as the API's /api route.
          npx wrangler deploy
