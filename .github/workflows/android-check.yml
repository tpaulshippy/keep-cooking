name: android-check

# Android gate: debug APK assembles and JVM unit tests pass. Runs on PRs
# touching apps/android and on every main push that touches it, so a broken
# Android build can never land silently (cf. contract-check for api/ios).
on:
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android-check.yml']
  push:
    branches: [main]
    paths: ['apps/android/**', '.github/workflows/android-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      # AGP 8.3 + Kotlin 1.9 / KSP 1.x must run on JDK 17 (newer JDKs break
      # the old Kotlin daemon / KSP incremental init with a cryptic
      # "IllegalArgumentException: <java.version>" in :app:kspDebugKotlin).
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default packages ('tools platform-tools') reference the long-removed
          # 'tools' package and fail; install exactly what AGP 8.3 needs.
          packages: platform-tools "platforms;android-34" "build-tools;34.0.0"

      # Caches Gradle + dependencies between runs. The repo ships a real
      # wrapper pinning Gradle 8.7 (apps/android/gradlew) — no system Gradle.
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug + unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace
