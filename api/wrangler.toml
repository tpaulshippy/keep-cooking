name = "keep-cooking-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
APP_VERSION = "0.1.0"
# Signing secret is NOT stored here — set via `wrangler secret put PHOTOS_SIGNING_SECRET`
# (a name can't be both a var and a secret). Dev default lives in src/index.ts.
PUBLIC_BASE_URL = "https://keep-cooking-api.pshippy-245.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "keep-cooking"
# Replace with the real id from `wrangler d1 create keep-cooking` before first deploy.
database_id = "local-keepcooking-placeholder"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "keep-cooking-photos"
