name = "smidgen-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
APP_VERSION = "0.1.0"
# Auth secret is NOT stored here — set via `wrangler secret put BETTER_AUTH_SECRET`
# (a name can't be both a var and a secret). Dev default lives in src/index.ts.
PUBLIC_BASE_URL = "https://smidgen-api.pshippy-245.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "smidgen"
# Replace with the real id from `wrangler d1 create smidgen` before first deploy.
database_id = "local-smidgen-placeholder"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "smidgen-photos"
