name = "keep-cooking-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
APP_VERSION = "0.1.0"
# Signing secret is NOT stored here — set via `wrangler secret put PHOTOS_SIGNING_SECRET`
# (a name can't be both a var and a secret). Dev default lives in src/index.ts.
PUBLIC_BASE_URL = "https://keepcooking.app/api"
# Custom-domain origin (issue #28): serve this Worker at keepcooking.app/api/*
# via a Workers Route (dashboard > Workers Routes > Add route, or
# `wrangler route add keepcooking.app/api/* keep-cooking-api`):
#   routes = [{ pattern = "keepcooking.app/api/*", zone_name = "keepcooking.app" }]
# (kept commented so local/staging deploys without that zone still work).
# Single-serve: the Worker mounts routes only at /api (old root-path
# workers.dev clients 404 — pre-launch, single tester, just update base URL).

[[d1_databases]]
binding = "DB"
database_name = "keep-cooking"
# Replace with the real id from `wrangler d1 create keep-cooking` before first deploy.
database_id = "f82ce751-9846-4b1c-a312-713a353abc8b"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "keep-cooking-photos"
