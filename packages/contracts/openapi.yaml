openapi: 3.1.0
info:
  title: Keep Cooking API
  version: 0.2.0
  description: Single Hono Worker + D1 + R2. MIT only. See packages/contracts/README.md.
servers:
  - url: https://api.keepcooking.local
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  version: { type: string }
  /openapi.json:
    get:
      operationId: openapi
      responses:
        '200':
          description: OpenAPI JSON (must match packages/contracts/openapi.json)
  /agent/enroll:
    post:
      operationId: agentEnroll
      description: >-
        Bind a householdHash bucket to a plaintext householdId label plus a
        token verifier (hex(SHA256(raw agent token))). Open: knowledge of the
        unguessable householdHash IS the capability. Re-enroll to rotate the
        token without rotating the data key. Never receives key material.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentEnrollRequest' }
      responses:
        '201':
          description: enrolled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentEnrollResponse' }
        '409':
          description: householdId label already bound to a different hash (present the existing agent token in x-agent-token to re-bind it)
  /agent/status:
    get:
      operationId: agentStatus
      security: [{ AgentToken: [] }]
      responses:
        '200':
          description: enrolled household for this token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentStatus' }
        '401':
          description: missing or unknown x-agent-token
  /mcp:
    post:
      operationId: mcpRpc
      security: [{ AgentToken: [] }]
      description: >-
        Stateless JSON-RPC 2.0 (Streamable HTTP subset): initialize (legacy
        handshake, kept for 2025 clients), server/discover (modern
        handshake), tools/list, tools/call, ping. Every tool call
        authenticates via x-agent-token; tools are scoped to the enrolled
        household. Tool schemas are versioned in packages/contracts/mcp-tools.json.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: JSON-RPC 2.0 request }
      responses:
        '200':
          description: JSON-RPC 2.0 response (or isError tool result)
          content:
            application/json:
              schema: { type: object }
        '202':
          description: notification accepted (no body, per Streamable HTTP)
        '401':
          description: missing or unknown x-agent-token
  /clip:
    post:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: clipRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClipRequest'
      responses:
        '200':
          description: parsed recipe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipReport'
  /recipes:
    get:
      operationId: listRecipes
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Recipe' }
    post:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: createRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipeInput' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recipe' }
  /recipes/{id}:
    get:
      operationId: getRecipe
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recipe' }
    put:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: updateRecipe
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipeInput' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recipe' }
    delete:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: deleteRecipe
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '204': { description: deleted }
  /recipes/{id}/scale:
    post:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: scaleRecipe
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [servings]
              properties:
                servings: { type: number, minimum: 0.25, maximum: 100 }
      responses:
        '200':
          description: scaled ingredient quantities (fraction-rounded display strings)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recipe' }
  /lists:
    get:
      operationId: listShoppingLists
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ShoppingList' }
    post:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: createShoppingList
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShoppingListInput' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingList' }
  /lists/{id}:
    get:
      operationId: getShoppingList
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingList' }
    put:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: updateShoppingList
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShoppingListInput' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingList' }
    delete:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: deleteShoppingList
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '204': { description: deleted }
  /pantry:
    get:
      operationId: listPantry
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PantryItem' }
    post:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: createPantryItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PantryItemInput' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PantryItem' }
  /pantry/{id}:
    put:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: updatePantryItem
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PantryItemInput' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PantryItem' }
    delete:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: deletePantryItem
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '204': { description: deleted }
  /plans:
    get:
      operationId: listPlans
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Plan' }
    post:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: createPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanInput' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
  /plans/{id}:
    get:
      operationId: getPlan
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
    put:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: updatePlan
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanInput' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
    delete:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: deletePlan
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '204': { description: deleted }
  /menus:
    get:
      operationId: listMenus
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Menu' }
    post:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: createMenu
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuInput' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menu' }
  /menus/{id}:
    get:
      operationId: getMenu
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menu' }
    put:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: updateMenu
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuInput' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menu' }
    delete:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: deleteMenu
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '204': { description: deleted }
  /plans/feed.ics:
    get:
      operationId: planFeed
      responses:
        '200':
          description: webcal feed
          content:
            text/calendar:
              schema: { type: string }
  /share/cookbook:
    post:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: shareCookbook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [householdId, recipeIds]
              properties:
                householdId: { type: string }
                recipeIds: { type: array, items: { type: string } }
                expiresInDays: { type: integer, default: 30 }
      responses:
        '201':
          description: share link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLink' }
  /export/{id}.json:
    get:
      operationId: exportJson
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: JSON export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recipe' }
  /export/{id}.md:
    get:
      operationId: exportMd
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: Markdown export
          content:
            text/markdown:
              schema: { type: string }
  /export/{id}.html:
    get:
      operationId: exportHtml
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: self-contained Schema.org HTML
          content:
            text/html:
              schema: { type: string }
  /sync/pull:
    get:
      operationId: syncPull
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: envelopes changed since timestamp
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SyncEnvelope' }
  /sync/push:
    post:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: syncPush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/SyncEnvelope' }
      responses:
        '200':
          description: server-won conflicts (empty = all accepted)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SyncEnvelope' }
  /v2/devices:
    post:
      operationId: enrollDevice
      description: >-
        Open enrollment — no device signature required (this is how devices
        join). 201 on first enroll, 200 on idempotent re-enroll with the same
        key, 410 when the id was revoked (gone, enroll a fresh deviceId
        instead), 409 when the id is already enrolled with a different key,
        400 on validation failure. Reads stay open; every other write requires
        the enrolled key (see DeviceSig).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceEnrollRequest' }
      responses:
        '201':
          description: enrolled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceEnrollResponse' }
        '200':
          description: already enrolled with the same key (idempotent)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceEnrollResponse' }
        '400':
          description: invalid deviceId / publicKey / displayName
        '409':
          description: device id already enrolled with a different key
        '410':
          description: device id was revoked (gone) — enroll a fresh deviceId instead
  /v2/devices/{id}/revoke:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: enrolled device id to revoke (self-only)
    post:
      operationId: revokeDevice
      description: >-
        Signed revocation (caller signs with its own enrolled key). Revoking
        your own key is logout — the next write from that key gets 401
        (device revoked). There is no shared token to rotate; enroll a fresh
        deviceId instead (re-enrolling this revoked id returns 410).
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      responses:
        '200':
          description: revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceRevokeResponse' }
        '401':
          description: missing / unknown / stale / bad / revoked device signature
        '403':
          description: not self (cross-device revoke deferred)
        '404':
          description: unknown device id
  /v2/sync/{hash}:
    parameters:
      - name: hash
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9a-f]{64}$' }
        description: hex householdHash (see docs/e2e-v1.md)
    get:
      operationId: e2ePull
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: encrypted envelopes changed since timestamp
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EncryptedEnvelope' }
    put:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: e2ePush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/EncryptedEnvelope' }
      responses:
        '200':
          description: stored ids (stale writes are idempotent no-ops)
          content:
            application/json:
              schema:
                type: object
                required: [stored]
                properties:
                  stored: { type: array, items: { type: string } }
    delete:
      security:
        - DeviceId: []
          DeviceTs: []
          DeviceSig: []
        - AgentToken: []
      operationId: e2eWipe
      responses:
        '200':
          description: wiped row count
          content:
            application/json:
              schema:
                type: object
                required: [wiped]
                properties:
                  wiped: { type: integer }
  /photos/dl:
    get:
      operationId: photoDownload
      description: >-
        Serve R2 photo bytes for a signed URL minted by GET /photos/sign (or
        the photos_sign MCP tool, which targets this route). Verifies the
        HMAC exp/sig first; no device signature or agent token required (the
        signature IS the capability, expiring in <15min).
      parameters:
        - name: key
          in: query
          required: true
          schema: { type: string }
        - name: exp
          in: query
          required: true
          schema: { type: integer }
        - name: sig
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: photo bytes (image/jpeg)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '400':
          description: key, exp, or sig missing
        '403':
          description: invalid or expired signature
        '404':
          description: photo serving unconfigured or key does not exist
components:
  securitySchemes:
    AgentToken:
      type: apiKey
      in: header
      name: x-agent-token
      description: >-
        Key-derived bearer (base64url of 32 HKDF-SHA256 bytes, domain-separated
        from the data key — see docs/agents/). Enroll via POST /agent/enroll,
        which stores only hex(SHA256(token)). Accepted as an alternative to
        the Ed25519 device signature on every mutating route (prod): reads
        are scoped to the enrolled household (out-of-scope reads are 404),
        writes require an explicit matching householdId (else 403). Blind
        /v2 envelopes stay opaque — the server verifies the token, never
        content.
    DeviceId:
      type: apiKey
      in: header
      name: x-device-id
      description: enrolled device id (UUIDv4, from POST /v2/devices)
    DeviceTs:
      type: apiKey
      in: header
      name: x-device-ts
      description: millis since epoch, digits only; |now - ts| <= 5 min. Replay window is a documented limitation (no server nonce ledger).
    DeviceSig:
      type: apiKey
      in: header
      name: x-device-sig
      description: >-
        base64 Ed25519 signature over the canonical string METHOD + "\n" +
        path+query + "\n" + ts + "\n" + hex(SHA256(bodyBytes)) (empty body
        hashes as hex(SHA256(""))). Required on every POST/PUT/DELETE except
        POST /v2/devices; GET/HEAD/OPTIONS, /health and /openapi.json stay
        open. Unknown / stale / revoked keys get 401 (self-revoke = logout).
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string }
    HouseholdId:
      name: householdId
      in: query
      schema: { type: string }
  schemas:
    DeviceEnrollRequest:
      type: object
      required: [deviceId, publicKey]
      properties:
        deviceId: { type: string, format: uuid, description: "UUIDv4, stable per device" }
        publicKey: { type: string, description: base64 of exactly 32 bytes (Ed25519 public key); the private half never leaves the device }
        displayName: { type: string, maxLength: 64 }
    DeviceEnrollResponse:
      type: object
      required: [deviceId, enrolledAt]
      properties:
        deviceId: { type: string, format: uuid }
        enrolledAt: { type: string, format: date-time }
    DeviceRevokeResponse:
      type: object
      required: [deviceId, revokedAt]
      properties:
        deviceId: { type: string, format: uuid }
        revokedAt: { type: string, format: date-time }
    SyncEnvelope:
      type: object
      required: [id, updatedAt, deviceId]
      properties:
        id: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
        deviceId: { type: string }
        deleted: { type: boolean, default: false }
        entity: { type: string, enum: [recipe, ingredient, step, list, pantryItem, plan, menu] }
        payload: { type: object, description: entity JSON }
    EncryptedEnvelope:
      type: object
      description: E2E v2 wrapper around a SyncEnvelope. Server stores bytes only; see docs/e2e-v1.md. v1 SyncEnvelope is unchanged.
      required: [v, alg, kid, householdHash, id, entity, updatedAt, deviceId, nonce, ciphertext]
      properties:
        v: { type: integer, const: 2, description: envelope version }
        alg: { type: string, const: AES-GCM-256, description: cipher (locked) }
        kid: { type: string, description: 'opaque per-household key id; feeds the HKDF info string' }
        householdHash: { type: string, description: 'hex(SHA256("smidgen-hh-v1" || syncCode || householdId)); must equal the :hash path param', pattern: '^[0-9a-f]{64}$' }
        id: { type: string, format: uuid }
        entity: { type: string, enum: [recipe, list, pantryItem, plan, menu], description: standalone ingredient/step envelopes are rejected (fold into the parent recipe pre-encrypt) }
        updatedAt: { type: string, format: date-time }
        deviceId: { type: string }
        deleted: { type: boolean, default: false }
        nonce: { type: string, description: base64, 12 random bytes, fresh per envelope (AES-GCM) }
        ciphertext: { type: string, description: base64, AES-GCM-256(raw-ciphertext + 16-byte tag) over canonical JSON of the v1 envelope payload }
    ClipRequest:
      type: object
      properties:
        url: { type: string, format: uri }
        caption: { type: string }
        source: { type: string, enum: [url, tiktok, instagram, youtube, ocr, clipboard] }
      anyOf:
        - required: [url]
        - required: [caption]
    ClipReport:
      type: object
      required: [strategy, recipe]
      properties:
        strategy: { type: string, enum: [jsonld, reader, caption, ocr] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        warnings: { type: array, items: { type: string } }
        sourceUrl: { type: string }
        recipe: { $ref: '#/components/schemas/RecipeInput' }
    Recipe:
      allOf:
        - $ref: '#/components/schemas/SyncEnvelope'
        - type: object
          required: [title, servings]
          properties:
            title: { type: string }
            description: { type: string }
            servings: { type: number }
            prepMinutes: { type: integer }
            cookMinutes: { type: integer }
            totalMinutes: { type: integer }
            rating: { type: number, minimum: 0, maximum: 5 }
            source: { type: string }
            sourceUrl: { type: string }
            categories: { type: array, items: { type: string } }
            photoKeys: { $ref: '#/components/schemas/PhotoKeys' }
            ingredients: { type: array, items: { $ref: '#/components/schemas/Ingredient' } }
            steps: { type: array, items: { $ref: '#/components/schemas/Step' } }
            householdId: { type: string }
    RecipeInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        servings: { type: number, default: 4 }
        prepMinutes: { type: integer }
        cookMinutes: { type: integer }
        rating: { type: number, minimum: 0, maximum: 5 }
        source: { type: string }
        sourceUrl: { type: string }
        categories: { type: array, items: { type: string } }
        photoKeys: { $ref: '#/components/schemas/PhotoKeys' }
        ingredients: { type: array, items: { $ref: '#/components/schemas/IngredientInput' } }
        steps: { type: array, items: { $ref: '#/components/schemas/StepInput' } }
        householdId: { type: string }
    Ingredient:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        quantity: { type: number, nullable: true }
        unit: { type: string }
        display: { type: string, description: fraction-rounded string e.g. 1 1/2 cups }
        position: { type: integer }
        recipeId: { type: string }
    IngredientInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        quantity: { type: number, nullable: true }
        unit: { type: string }
        display: { type: string }
        position: { type: integer }
    Step:
      type: object
      required: [id, position, text]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer }
        text: { type: string }
        timers: { type: array, items: { $ref: '#/components/schemas/StepTimer' } }
        recipeId: { type: string }
    StepInput:
      type: object
      required: [text]
      properties:
        position: { type: integer }
        text: { type: string }
    StepTimer:
      type: object
      required: [seconds, label]
      properties:
        seconds: { type: integer }
        label: { type: string }
    ShoppingList:
      allOf:
        - $ref: '#/components/schemas/SyncEnvelope'
        - type: object
          properties:
            name: { type: string }
            householdId: { type: string }
            items:
              type: array
              items: { $ref: '#/components/schemas/ListItem' }
    ShoppingListInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        householdId: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/ListItemInput' }
    ListItem:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        quantity: { type: string }
        aisle: { type: string }
        checked: { type: boolean, default: false }
        recipeId: { type: string, nullable: true }
    ListItemInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        quantity: { type: string }
        aisle: { type: string }
        checked: { type: boolean }
        recipeId: { type: string, nullable: true }
    PantryItem:
      allOf:
        - $ref: '#/components/schemas/SyncEnvelope'
        - type: object
          properties:
            name: { type: string }
            quantity: { type: string }
            location: { type: string }
            expiresAt: { type: string, format: date, nullable: true }
            lowThreshold: { type: string }
            barcode: { type: string }
            householdId: { type: string }
    PantryItemInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        quantity: { type: string }
        location: { type: string }
        expiresAt: { type: string, format: date, nullable: true }
        lowThreshold: { type: string }
        barcode: { type: string }
        householdId: { type: string }
    Plan:
      allOf:
        - $ref: '#/components/schemas/SyncEnvelope'
        - type: object
          properties:
            date: { type: string, format: date }
            meal: { type: string, enum: [breakfast, lunch, dinner, snack] }
            recipeId: { type: string, nullable: true }
            note: { type: string }
            servings: { type: number }
            householdId: { type: string }
    PlanInput:
      type: object
      required: [date, meal]
      properties:
        date: { type: string, format: date }
        meal: { type: string, enum: [breakfast, lunch, dinner, snack] }
        recipeId: { type: string, nullable: true }
        note: { type: string }
        servings: { type: number }
        householdId: { type: string }
    Menu:
      allOf:
        - $ref: '#/components/schemas/SyncEnvelope'
        - type: object
          properties:
            name: { type: string }
            householdId: { type: string }
            entries:
              type: array
              items:
                type: object
                properties:
                  dayOffset: { type: integer }
                  meal: { type: string }
                  recipeId: { type: string }
                  servings: { type: number }
    MenuInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        householdId: { type: string }
        entries:
          type: array
          items:
            type: object
            properties:
              dayOffset: { type: integer }
              meal: { type: string }
              recipeId: { type: string }
              servings: { type: number }
    PhotoKeys:
      type: object
      description: R2 keys. URL signing <15min. Variants thumb/1024/original.
      properties:
        original: { type: string }
        large1024: { type: string }
        thumb: { type: string }
    Household:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [owner, member, viewer] }
    AgentEnrollRequest:
      type: object
      description: Binds an unguessable householdHash bucket to a householdId label + token verifier. Carries no key material.
      required: [householdHash, householdId, verifier]
      properties:
        householdHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        householdId: { type: string }
        verifier: { type: string, description: hex(SHA256(raw agent-token bytes)), pattern: '^[0-9a-f]{64}$' }
    AgentEnrollResponse:
      type: object
      required: [ok, householdId, householdHash, hashPrefix8]
      properties:
        ok: { type: boolean }
        householdId: { type: string }
        householdHash: { type: string }
        hashPrefix8: { type: string }
    AgentStatus:
      type: object
      required: [householdId, hashPrefix8, deviceId]
      properties:
        householdId: { type: string }
        hashPrefix8: { type: string }
        deviceId: { type: string }
    ShareLink:
      type: object
      required: [id, url]
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
