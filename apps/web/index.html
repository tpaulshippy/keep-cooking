<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Keep Cooking — offline-first recipe, plan, shop and pantry app." />
    <title>Keep Cooking</title>
    <script>try{var t=localStorage.getItem("kc.theme")||"auto";if(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-theme","dark");else if(t==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
  </head>
  <body>
    <main id="app" role="main" aria-label="Keep Cooking app">
      <noscript>Keep Cooking needs JavaScript enabled.</noscript>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
